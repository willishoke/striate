[project]
name = "striate"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Modern, hi-res feature visualization and temporal morphing -- a clean-room take on Distill 2017, pointed at a contemporary CNN."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "tqdm",
    "timm>=1.0.27",
    "scikit-learn",
    "spandrel",
]

[project.scripts]
striate = "striate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["striate"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# experiments/ is research code: formatted, but not held to lint
exclude = ["experiments/**"]

[tool.ruff.lint.flake8-comprehensions]
# allow dict(key=val) (the style of strobe_bench's config tables); bare dict()/list() still flagged
allow-dict-calls-with-keyword-arguments = true
