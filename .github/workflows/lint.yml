name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # ruff pinned so a new release's default rules can't break CI on its own
      - run: uvx ruff@0.17.2 check --output-format github .
      - run: uvx ruff@0.17.2 format --check .
